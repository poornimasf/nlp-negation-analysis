version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - cd negation-analyzer
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: negation-analyzer/build
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    appRoot: main
