version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - cd negation-analyzer
            - rm -rf node_modules package-lock.json
            - npm install --no-package-lock
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: negation-analyzer/build
        files:
          - '**/*'
      cache:
        paths:
          - negation-analyzer/node_modules/**/*
